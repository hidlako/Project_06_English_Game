<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn { transition: all 0.2s; }
        .option-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 1. DATA STRUCTURE: The Question Bank
        const questionBank = [
            {
                id: 1,
                category: "Prepositions",
                question: "I'll see you ___ Monday morning.",
                options: [
                    { text: "in", correct: false, why: "Incorrect. We use 'in' for months or years, but 'on' is required for specific days of the week." },
                    { text: "at", correct: false, why: "Incorrect. 'At' is used for specific times (e.g., at 5 PM) or holiday periods, not for days." },
                    { text: "on", correct: true, why: "Correct! We always use 'on' for days of the week and specific dates." }
                ]
            },
            {
                id: 2,
                category: "Future Tense",
                question: "Watch out! You ___ drop that glass!",
                options: [
                    { text: "will", correct: false, why: "Incorrect. 'Will' is for predictions or promises. When you see something happening right now (evidence), we use 'going to'." },
                    { text: "are going to", correct: true, why: "Correct! 'Going to' is used when there is present evidence of a future event." },
                    { text: "shall", correct: false, why: "Incorrect. 'Shall' is formal and usually used for offers or suggestions, not for immediate physical warnings." }
                ]
            },
            {
                id: 3,
                category: "Past Tense",
                question: "I ___ to the cinema yesterday.",
                options: [
                    { text: "have gone", correct: false, why: "Incorrect. 'Have gone' is Present Perfect. Since we specified a finished time ('yesterday'), we must use Past Simple." },
                    { text: "went", correct: true, why: "Correct! 'Went' is the Past Simple form, used for actions completed at a specific time in the past." },
                    { text: "was go", correct: false, why: "Incorrect. This is grammatically impossible. You would say 'was going' for a continuous action, or simply 'went'." }
                ]
            }
        ];

        function App() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const [score, setScore] = useState(0);
            const [quizComplete, setQuizComplete] = useState(false);

            const handleAnswer = (option) => {
                if (showFeedback) return;
                setSelectedOption(option);
                setShowFeedback(true);
                if (option.correct) setScore(score + 1);
            };

            const nextQuestion = () => {
                setShowFeedback(false);
                setSelectedOption(null);
                if (currentQuestion + 1 < questionBank.length) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setQuizComplete(true);
                }
            };

            const restart = () => {
                setCurrentQuestion(0);
                setScore(0);
                setQuizComplete(false);
                setShowFeedback(false);
            };

            if (quizComplete) {
                return (
                    <div class="max-w-md mx-auto mt-20 p-8 bg-white rounded-2xl shadow-xl text-center">
                        <h1 class="text-3xl font-bold text-slate-800 mb-4">Quiz Finished!</h1>
                        <p class="text-xl mb-6">Your Score: <span class="font-bold text-blue-600">{score} / {questionBank.length}</span></p>
                        <button onClick={restart} class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 w-full">Try Again</button>
                    </div>
                );
            }

            const q = questionBank[currentQuestion];

            return (
                <div class="max-w-md mx-auto mt-10 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-sm font-bold uppercase tracking-widest text-blue-500">{q.category}</span>
                        <span class="text-sm text-slate-400">Question {currentQuestion + 1}/{questionBank.length}</span>
                    </div>

                    <h2 class="text-2xl font-semibold text-slate-800 mb-8 leading-tight">
                        "{q.question}"
                    </h2>

                    <div class="space-y-4">
                        {q.options.map((opt, i) => (
                            <button
                                key={i}
                                onClick={() => handleAnswer(opt)}
                                disabled={showFeedback}
                                class={`option-btn w-full p-4 rounded-xl border-2 text-left font-medium transition-all ${
                                    showFeedback 
                                    ? opt.correct ? 'border-green-500 bg-green-50' : opt === selectedOption ? 'border-red-500 bg-red-50' : 'border-slate-100'
                                    : 'border-slate-200 hover:border-blue-400 bg-white'
                                }`}
                            >
                                {opt.text}
                            </button>
                        ))}
                    </div>

                    {showFeedback && (
                        <div class={`mt-8 p-5 rounded-xl animate-in fade-in slide-in-from-bottom-4 duration-300 ${selectedOption.correct ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                            <p class="font-bold mb-1">{selectedOption.correct ? "✅ Great job!" : "❌ Not quite..."}</p>
                            <p class="text-sm leading-relaxed">{selectedOption.why}</p>
                            <button onClick={nextQuestion} class="mt-4 w-full bg-slate-800 text-white py-2 rounded-lg font-bold">
                                {currentQuestion + 1 === questionBank.length ? "See Results" : "Next Question"}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
